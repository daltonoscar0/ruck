[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruck"
version = "0.1.0"
description = "Rugby phase-play surprisal analyzer and workload/injury-model leakage auditor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton" }]
keywords = ["rugby", "phase-play", "language-model", "surprisal", "acwr", "leakage"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "requests>=2.31",
    "tqdm>=4.66",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ruck = "ruck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ruck"]

[tool.hatch.build.targets.wheel.force-include]
"demo" = "ruck/_demo"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored audit fixtures are deliberately-broken research code. They are audit
# input, not source, and are never imported.
extend-exclude = ["demo/audit_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "error",
    # torch still imports pkg_resources on some 2.x builds
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
]
