[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acwr"
version = "0.1.0"
description = "Acute:chronic workload ratio and training-load metrics, with no dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abdullah Kaddoura" }]
keywords = ["acwr", "training-load", "sports-science", "wearables", "athlete-monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
acwr = "acwr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acwr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
